<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Adicionar Produto</title>
  <link rel="stylesheet" href="assets/css/form.css"> <!-- Coloque dentro da pasta assets/css -->
</head>
<body>
  <h2>Cadastrar Novo Produto</h2>
  
  <form action="adicionar_produto.php" method="POST">
    <label for="nome">Nome do Produto:</label><br>
    <input type="text" id="nome" name="nome" required><br><br>

    <label for="preco">Preço:</label><br>
    <input type="number" step="0.01" id="preco" name="preco" required><br><br>

    <label for="imagem">URL da Imagem:</label><br>
    <input type="text" id="imagem" name="imagem" required><br><br>

    <button type="submit">Cadastrar Produto</button>
  </form>
</body>
</html>
